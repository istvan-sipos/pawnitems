# pawnitems.ini — configuration for the DDDA pawnitems mod.
# Lives beside pawnitems.dll.  Lines starting with ; or # are comments.
#
# pawnitems.log handling.  One of:
#   disabled - no log file written (silent operation)
#   truncate - log file is reset to empty at each session start (default)
#   append   - new session appends to the existing log
logging = truncate

